# Garage (S3-compatible object storage) config for a single-node deployment.
# Docs: https://garagehq.deuxfleurs.fr/documentation/quick-start/
#
# This file is mounted read-only into the `garage` service in docker-compose.yml.
#
# NOTE: `rpc_secret` is intentionally NOT set here so no secret is committed to the repo.
# It is injected at runtime via the GARAGE_RPC_SECRET environment variable (see
# docker-compose.yml and .env.example). `rpc_secret` only secures node-to-node RPC, which is
# irrelevant for a single-node cluster with no peers, but Garage still requires it to be set.

metadata_dir = "/data/meta"
data_dir = "/data/data"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
