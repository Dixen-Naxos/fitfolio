server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # Critical Flutter web entry/update files must revalidate on every load so
    # service worker updates are discovered promptly on mobile browsers.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    # Long-lived caching for hashed/static build assets.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|wasm)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry point so app updates are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # go_router uses path-based (not hash-based) routing, so any unmatched path
    # must fall back to index.html for client-side routing/deep links to work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
