services:
  db:
    ports: !reset []  # do not expose postgres publicly in production
    restart: always

  minio:
    # !override replaces (rather than appends to) the dev port mappings, so MinIO is not
    # publicly reachable on 0.0.0.0 in production.
    ports: !override
      - "127.0.0.1:9000:9000"   # keep S3 API loopback-only; expose via reverse proxy if needed
      - "127.0.0.1:9001:9001"   # keep console loopback-only
    restart: always

  api:
    # `build` stays so `docker compose build`/local dev still works, but the CI/CD pipeline
    # (.github/workflows/api-ci.yml) pushes to Docker Hub and this `image` tag is what
    # `docker compose pull && up -d` actually deploys on the server - without it, `pull` has
    # nothing to fetch and `up -d` just keeps running the old locally-built image.
    image: ${DOCKERHUB_USERNAME}/fitfolio:api
    build:
      context: ./api
    restart: always
    volumes: !reset []  # do not bind-mount source in production, use the built image
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: !reset []  # no host port: only reachable through Traefik over the docker network
    environment:
      # Lock CORS down to the real production frontend origin instead of the "*" dev default.
      CORS_ORIGINS: https://${FRONTEND_DOMAIN_NAME}
    networks:
      - default   # to reach db/minio
      - traefik   # so the external Traefik instance can route to this container
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fitfolio-api.rule=Host(`${API_DOMAIN_NAME}`)"
      - "traefik.http.routers.fitfolio-api.entrypoints=websecure"
      - "traefik.http.routers.fitfolio-api.tls.certresolver=myresolver"
      - "traefik.http.services.fitfolio-api.loadbalancer.server.port=8000"

  web:
    # Same pattern as `api`: `build` supports local dev, `image` is what
    # `docker compose pull && up -d` (web-ci.yml's SSH redeploy step) actually deploys.
    image: ${DOCKERHUB_USERNAME}/fitfolio:web
    build:
      context: ./app
      args:
        API_BASE_URL: https://${API_DOMAIN_NAME}/api/v1
    restart: always
    networks:
      - traefik   # so the external Traefik instance can route to this container
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fitfolio-web.rule=Host(`${FRONTEND_DOMAIN_NAME}`)"
      - "traefik.http.routers.fitfolio-web.entrypoints=websecure"
      - "traefik.http.routers.fitfolio-web.tls.certresolver=myresolver"
      - "traefik.http.services.fitfolio-web.loadbalancer.server.port=80"

networks:
  # Pre-existing Traefik instance from another docker-compose project on this server,
  # created there (e.g. `docker network create traefik` or via that project's own
  # compose file) - not managed here, just joined.
  traefik:
    external: true
