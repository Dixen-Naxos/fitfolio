services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitfolio}
      POSTGRES_DB: ${POSTGRES_DB:-fitfolio}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    # MinIO's OSS image was discontinued/archived in favor of their paid "AIStor" product,
    # so we use Garage (https://garagehq.deuxfleurs.fr) instead - a lightweight, actively
    # maintained, self-hosted S3-compatible store. It speaks the same S3 API, so the API
    # service still talks to it via the `minio` Python SDK unchanged.
    image: dxflrs/garage:v2.3.0
    restart: always
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-fitfolio}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY:-fitfolio123fitfolio123fitfolio1}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:-fitfolio-images}
    ports:
      - "127.0.0.1:3900:3900"   # keep S3 API loopback-only; expose via reverse proxy if needed
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/data/meta
      - garage-data:/data/data
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fitfolio-garage.rule=Host(`${GARAGE_API_DOMAIN_NAME}`)"
      - "traefik.http.routers.fitfolio-garage.entrypoints=websecure"
      - "traefik.http.routers.fitfolio-garage.tls.certresolver=myresolver"
      - "traefik.http.services.fitfolio-garage.loadbalancer.server.port=3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # `image` is what the CI/CD workflow (.github/workflows/api-ci.yml) pushes to Docker Hub and
    # what `docker compose pull && up -d` deploys on redeploy. `build` is kept so you can still
    # `docker compose build`/`up --build` locally if you ever need to test a change without CI.
    image: ${DOCKERHUB_USERNAME}/fitfolio:api
    build:
      context: ./api
    restart: always
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fitfolio}:${POSTGRES_PASSWORD:-fitfolio}@db:5432/${POSTGRES_DB:-fitfolio}
      MINIO_ENDPOINT: garage:3900
      MINIO_PRESIGN_ENDPOINT: ${GARAGE_API_DOMAIN_NAME}
      MINIO_PRESIGN_SECURE: "true"
      MINIO_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-fitfolio}
      MINIO_SECRET_KEY: ${GARAGE_SECRET_KEY:-fitfolio123fitfolio123fitfolio1}
      MINIO_BUCKET: ${GARAGE_BUCKET:-fitfolio-images}
      MINIO_SECURE: "false"
      MINIO_REGION: garage
      # Lock CORS down to the real production frontend origin.
      CORS_ORIGINS: https://${FRONTEND_DOMAIN_NAME}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    networks:
      - default   # to reach db/garage
      - traefik   # so the external Traefik instance can route to this container
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fitfolio-api.rule=Host(`${API_DOMAIN_NAME}`)"
      - "traefik.http.routers.fitfolio-api.entrypoints=websecure"
      - "traefik.http.routers.fitfolio-api.tls.certresolver=myresolver"
      - "traefik.http.services.fitfolio-api.loadbalancer.server.port=8000"

  web:
    # Same pattern as `api`: `image` is what web-ci.yml's SSH redeploy step deploys, `build`
    # supports building/testing locally without going through CI.
    image: ${DOCKERHUB_USERNAME}/fitfolio:web
    build:
      context: ./app
      args:
        API_BASE_URL: https://${API_DOMAIN_NAME}/api/v1
    restart: always
    networks:
      - traefik   # so the external Traefik instance can route to this container
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fitfolio-web.rule=Host(`${FRONTEND_DOMAIN_NAME}`)"
      - "traefik.http.routers.fitfolio-web.entrypoints=websecure"
      - "traefik.http.routers.fitfolio-web.tls.certresolver=myresolver"
      - "traefik.http.services.fitfolio-web.loadbalancer.server.port=80"

networks:
  # Pre-existing Traefik instance from another docker-compose project on this server,
  # created there (e.g. `docker network create traefik` or via that project's own
  # compose file) - not managed here, just joined.
  traefik:
    external: true

volumes:
  db-data:
  garage-meta:
  garage-data:
